name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ghcr.io/upt-faing-epis/lost-found-university-api:${{ github.sha }} .
      - name: Push backend image
        run: docker push ghcr.io/upt-faing-epis/lost-found-university-api:${{ github.sha }}
      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      - name: Deploy container to Azure Web App
        run: >
          az webapp config container set
          --name ${{ secrets.AZURE_WEBAPP_NAME }}
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
          --container-image-name ghcr.io/upt-faing-epis/lost-found-university-api:${{ github.sha }}
