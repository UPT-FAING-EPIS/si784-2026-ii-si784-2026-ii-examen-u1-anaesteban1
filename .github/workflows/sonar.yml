name: sonar

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install Sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Restore
        run: dotnet restore LostAndFoundUniversity.sln -m:1
      - name: Resolve Sonar project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          project_key="${SONAR_PROJECT_KEY:-lost-found-university}"
          organization="${SONAR_ORGANIZATION:-}"
          if [ -z "$organization" ]; then
            organization="$(curl -fsS -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/organizations/search" | jq -r '.organizations[0].key // empty')"
          fi
          if [ -z "$organization" ]; then
            echo "No SonarCloud organization was found for SONAR_TOKEN."
            exit 1
          fi
          echo "SONAR_ORGANIZATION=$organization" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_KEY=$project_key" >> "$GITHUB_ENV"
      - name: Begin Sonar analysis
        run: dotnet sonarscanner begin /k:"${SONAR_PROJECT_KEY}" /o:"${SONAR_ORGANIZATION}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.qualitygate.wait=true
      - name: Build
        run: dotnet build LostAndFoundUniversity.sln --configuration Release --no-restore -m:1
      - name: Test
        run: dotnet test LostAndFoundUniversity.sln --configuration Release --no-build -m:1
      - name: End Sonar analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
