name: generate-documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate required documentation
        run: |
          test -f docs/data-dictionary.md
          test -f docs/entity-relationship.md
          test -f docs/class-diagram.md
          test -f docs/component-diagram.md
          test -f docs/deployment-diagram.md
          grep -R "mermaid" docs/entity-relationship.md docs/class-diagram.md docs/component-diagram.md docs/deployment-diagram.md
      - uses: actions/upload-artifact@v4
        with:
          name: project-documentation
          path: docs/*.md
